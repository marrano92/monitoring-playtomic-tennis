name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "state.json"
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall -q .

      - name: Validate config.json
        run: python -c "import json; json.load(open('config.json')); print('config.json ok')"
